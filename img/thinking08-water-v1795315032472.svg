<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780">
<rect width="900" height="780" fill="#08131c"/>

<text x="60" y="52" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="bold" fill="#e8f6ff">举折：水越多的地方，坡越平</text>
<text x="60" y="82" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6f96a8">《营造法式》折屋之法 · 半跨 20 尺、举高 10.8 尺、四架 · 每缝折量减半，步架不变</text>

<line x1="130" y1="420" x2="130" y2="112" stroke="#24404f" stroke-width="1"/>
<line x1="130" y1="420" x2="700" y2="420" stroke="#24404f" stroke-width="1"/>

<g font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5c8095" text-anchor="end">
<text x="120" y="424">0</text>
<text x="120" y="368">2</text>
<text x="120" y="312">4</text>
<text x="120" y="256">6</text>
<text x="120" y="200">8</text>
<text x="120" y="144">10</text>
</g>
<g font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5c8095" text-anchor="middle">
<text x="130" y="440">0</text>
<text x="270" y="440">5</text>
<text x="410" y="440">10</text>
<text x="550" y="440">15</text>
<text x="680" y="440">20</text>
</g>
<text x="415" y="468" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5c8095" text-anchor="middle">半跨（尺）　脊 → 檐</text>
<text x="92" y="266" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5c8095" text-anchor="middle" transform="rotate(-90 92 266)">举高（尺）</text>

<line x1="130" y1="118" x2="690" y2="420" stroke="#3d6076" stroke-width="1.5" stroke-dasharray="7 7"/>

<polygon points="130,118 270,223 410,304 550,370 690,420" fill="#0f3548"/>
<polyline points="130,118 270,223 410,304 550,370 690,420" fill="none" stroke="#7fd8ff" stroke-width="3"/>

<circle cx="130" cy="118" r="5" fill="#ffffff"/>
<circle cx="270" cy="223" r="4.5" fill="#ffffff"/>
<circle cx="410" cy="304" r="4.5" fill="#ffffff"/>
<circle cx="550" cy="370" r="4.5" fill="#ffffff"/>
<circle cx="690" cy="420" r="5" fill="#ffffff"/>

<g font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#7fd8ff" text-anchor="middle">
<text x="200" y="205">37.1°</text>
<text x="340" y="298">29.9°</text>
<text x="478" y="374">25.1°</text>
<text x="612" y="384">19.8°</text>
</g>
<g font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#4b7089" text-anchor="middle">
<text x="130" y="106">脊</text>
<text x="694" y="438">檐</text>
</g>

<text x="130" y="528" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#9dbecf">每段要接的水：上方累积的屋面水平投影</text>
<line x1="130" y1="690" x2="700" y2="690" stroke="#24404f" stroke-width="1"/>

<rect x="165" y="657" width="70" height="33" fill="#ffb35c" opacity="0.85" rx="2"/>
<rect x="305" y="625" width="70" height="65" fill="#ffb35c" opacity="0.85" rx="2"/>
<rect x="445" y="592" width="70" height="98" fill="#ffb35c" opacity="0.85" rx="2"/>
<rect x="585" y="560" width="70" height="130" fill="#ffb35c" opacity="0.85" rx="2"/>

<g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#ffcf9a" text-anchor="middle">
<text x="200" y="646">5</text>
<text x="340" y="614">10</text>
<text x="480" y="581">15</text>
<text x="620" y="549">20</text>
</g>

<text x="130" y="722" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#9dbecf">坡度的方向：37.1° → 29.9° → 25.1° → 19.8°（往下越平）</text>
<text x="130" y="748" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ffb35c">汇水的方向：5 → 10 → 15 → 20 尺（往下越多）</text>
</svg>