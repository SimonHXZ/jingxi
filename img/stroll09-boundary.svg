<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660">
  <rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>

  <!-- 阴影：两条解释给出同一个数的那一段 -->
  <rect x="199.1" y="90" width="577.4" height="460" fill="#f5eddb" opacity="0.9"/>

  <!-- 0.05 横格 -->
  <g stroke="#ded9cf" stroke-width="1" stroke-dasharray="3 4">
    <line x1="90" y1="532.3" x2="930" y2="532.3"/>
    <line x1="90" y1="488.1" x2="930" y2="488.1"/>
    <line x1="90" y1="443.9" x2="930" y2="443.9"/>
    <line x1="90" y1="399.7" x2="930" y2="399.7"/>
    <line x1="90" y1="355.5" x2="930" y2="355.5"/>
    <line x1="90" y1="311.3" x2="930" y2="311.3"/>
    <line x1="90" y1="267.1" x2="930" y2="267.1"/>
    <line x1="90" y1="222.8" x2="930" y2="222.8"/>
    <line x1="90" y1="178.6" x2="930" y2="178.6"/>
    <line x1="90" y1="134.4" x2="930" y2="134.4"/>
  </g>

  <!-- 轴 -->
  <line x1="90" y1="550" x2="930" y2="550" stroke="#8c8578" stroke-width="1.4"/>
  <line x1="90" y1="90" x2="90" y2="550" stroke="#8c8578" stroke-width="1.4"/>

  <!-- 纵轴刻度值 -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8c8578" text-anchor="end">
    <text x="82" y="536">1.00</text>
    <text x="82" y="492">1.05</text>
    <text x="82" y="448">1.10</text>
    <text x="82" y="404">1.15</text>
    <text x="82" y="360">1.20</text>
    <text x="82" y="315">1.25</text>
    <text x="82" y="271">1.30</text>
    <text x="82" y="227">1.35</text>
    <text x="82" y="183">1.40</text>
    <text x="82" y="138">1.45</text>
  </g>

  <!-- 横轴刻度与举名 -->
  <g stroke="#8c8578" stroke-width="1.2">
    <line x1="134.2" y1="550" x2="134.2" y2="556"/>
    <line x1="222.6" y1="550" x2="222.6" y2="556"/>
    <line x1="311.1" y1="550" x2="311.1" y2="556"/>
    <line x1="399.5" y1="550" x2="399.5" y2="556"/>
    <line x1="487.9" y1="550" x2="487.9" y2="556"/>
    <line x1="576.3" y1="550" x2="576.3" y2="556"/>
    <line x1="664.7" y1="550" x2="664.7" y2="556"/>
    <line x1="753.2" y1="550" x2="753.2" y2="556"/>
    <line x1="841.6" y1="550" x2="841.6" y2="556"/>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">
    <text x="134.2" y="574">二举</text>
    <text x="222.6" y="574">三举</text>
    <text x="311.1" y="574">四举</text>
    <text x="399.5" y="574">五举</text>
    <text x="487.9" y="574">六举</text>
    <text x="576.3" y="574">七举</text>
    <text x="664.7" y="574">八举</text>
    <text x="753.2" y="574">九举</text>
    <text x="841.6" y="574">十举</text>
  </g>

  <!-- 直线 -->
  <line x1="98.8" y1="550" x2="930" y2="134.4" stroke="#c9722a" stroke-width="2.6"/>

  <!-- 曲线 -->
  <polyline points="90.0,522.4 107.7,519.6 125.4,516.5 143.0,513.0 160.7,509.2 178.4,505.1 196.1,500.6 213.8,495.9 231.5,490.8 249.2,485.4 266.9,479.7 284.6,473.7 302.3,467.4 319.9,460.9 337.6,454.0 355.3,446.9 373.0,439.5 390.7,431.9 408.4,423.9 426.1,415.8 443.8,407.4 461.5,398.7 479.2,389.9 496.8,380.8 514.5,371.5 532.2,361.9 549.9,352.2 567.6,342.2 585.3,332.1 603.0,321.8 620.7,311.3 638.4,300.6 656.0,289.6 673.7,278.6 691.4,267.4 709.1,256.1 726.8,244.5 744.5,232.8 762.2,222.0 779.9,209.1 797.6,196.9 815.3,184.7 832.9,172.3 850.6,159.8 868.3,147.2 886.0,134.4 903.7,121.6 921.4,108.6 930.0,102.1" fill="none" stroke="#1f6f8b" stroke-width="2.6"/>

  <!-- 六档：真值点 + 向上取整到的方块 + 竖虚线 -->
  <g stroke="#8c8578" stroke-width="1" stroke-dasharray="2 3">
    <line x1="311.1" y1="464.2" x2="311.1" y2="443.9"/>
    <line x1="399.5" y1="428.0" x2="399.5" y2="399.7"/>
    <line x1="487.9" y1="385.3" x2="487.9" y2="355.5"/>
    <line x1="576.3" y1="337.2" x2="576.3" y2="311.3"/>
    <line x1="664.7" y1="284.2" x2="664.7" y2="267.1"/>
    <line x1="753.2" y1="227.0" x2="753.2" y2="222.8"/>
  </g>
  <g fill="#1f6f8b">
    <circle cx="311.1" cy="464.2" r="4.2"/>
    <circle cx="399.5" cy="428.0" r="4.2"/>
    <circle cx="487.9" cy="385.3" r="4.2"/>
    <circle cx="576.3" cy="337.2" r="4.2"/>
    <circle cx="664.7" cy="284.2" r="4.2"/>
    <circle cx="753.2" cy="227.0" r="4.2"/>
  </g>
  <g fill="#c9722a">
    <rect x="307.6" y="440.4" width="7" height="7"/>
    <rect x="396.0" y="396.2" width="7" height="7"/>
    <rect x="484.4" y="352.0" width="7" height="7"/>
    <rect x="572.8" y="307.8" width="7" height="7"/>
    <rect x="661.2" y="263.6" width="7" height="7"/>
    <rect x="749.7" y="219.3" width="7" height="7"/>
  </g>

  <!-- 两个交点 -->
  <circle cx="199.1" cy="499.9" r="6.5" fill="#fbfaf7" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="776.5" cy="211.1" r="6.5" fill="#fbfaf7" stroke="#3a3a3a" stroke-width="2"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">
    <text x="206" y="528">k = 0.2734</text>
    <text x="700" y="240">k = 0.9266</text>
  </g>

  <!-- 十举：出了界，取整一下撞到上一格 -->
  <line x1="841.6" y1="131.0" x2="841.6" y2="166.1" stroke="#8c8578" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="841.6" cy="166.1" r="4.2" fill="#1f6f8b"/>
  <rect x="838.1" y="131.0" width="7" height="7" fill="#c9722a"/>
  <text x="690" y="104" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#3a3a3a">到十举就撞开：真值 1.4142 ／ 直线 1.40 ／ 取整 1.45</text>

  <!-- 图例 -->
  <line x1="100" y1="112" x2="126" y2="112" stroke="#1f6f8b" stroke-width="2.6"/>
  <text x="134" y="116" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f6f8b">√(1+举²)　真值</text>
  <line x1="100" y1="136" x2="126" y2="136" stroke="#c9722a" stroke-width="2.6"/>
  <text x="134" y="140" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#c9722a">0.90 + 0.5·举　直线</text>
  <line x1="100" y1="160" x2="126" y2="160" stroke="#ded9cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="134" y="164" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#8c8578">0.05 一格（匠人报得出口的数）</text>

  <!-- 标题 -->
  <text x="90" y="44" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#2b2b2b">两条解释的交界</text>
  <text x="90" y="68" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b6b6b">同一张加举表，为什么从四举到九举，两条算出来一个数不差</text>

  <!-- 底部说明 -->
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3a3a3a">
    <text x="90" y="600">阴影那一段（0.2734 &lt; k &lt; 0.9266）里，曲线一直在直线上方不到一格的地方 —— 往上取一格，正好落在直线上。</text>
    <text x="90" y="622">六档全在里面。所以「六档全对」不是规矩准，是这一段区间决定的。</text>
    <text x="90" y="644">上界只比九举的 0.9 高 0.0266 —— 半档都不到。书里的台阶到九举为止，刚好停在岔口前一步。</text>
  </g>
</svg>